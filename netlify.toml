# fastconfirm.it is served by Netlify from the official repo, ethereum/fcr-website (README → Hosting).
# Headers and redirects live in public/_headers and public/_redirects, which Netlify and Cloudflare Pages
# both read from dist/.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
